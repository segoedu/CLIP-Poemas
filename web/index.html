<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explorador de afinidades entre poemas y pinturas calculadas con Jina-CLIP v2">
  <base href="/web/">
  <title>Poemas &amp; Pinturas · Afinidades</title>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var v = JSON.parse(localStorage.getItem("pp_theme"));
        if (v === "light" || v === "dark") { document.documentElement.dataset.theme = v; return; }
      } catch (e) {}
      if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/poetas">
      <span class="brand-mark" aria-hidden="true"><img src="logo.png" alt="" width="28" height="28"></span>
      <span class="brand-text">
        <span class="brand-title">Poemas &amp; Pinturas</span>
        <span class="brand-sub">Afinidades 2D en el arte</span>
      </span>
    </a>
    <div class="header-actions">
      <form id="global-search" class="global-search" role="search">
        <span class="global-search-icon" aria-hidden="true">&#9906;</span>
        <input id="global-search-input" type="search" placeholder="Buscar en poemas…" autocomplete="off" aria-label="Buscar en poemas">
        <button type="button" id="global-search-clear" class="clear-search" aria-label="Limpiar búsqueda" hidden>&#10005;</button>
      </form>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">&#9728;</button>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#/poetas" data-nav="poetas">🪶 Poetas</a>
        <a href="#/pintores" data-nav="pintores">🎨 Pintores</a>
        <a href="#/poemas" data-nav="poemas">📜 Poemas</a>
        <a href="#/galeria" data-nav="galeria" class="nav-featured">✦ Galería</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <span>Explorador de afinidades poema&#8596;obra · <em>Jina-CLIP v2</em></span>
    <span class="footer-meta" id="footer-meta"></span>
  </footer>

  <script src="data_home.js.gz"></script>
  <script src="app.js"></script>
</body>
</html>
